apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendstore
  labels:
    app: trendstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trendstore
  template:
    metadata:
      labels:
        app: trendstore
    spec:
      containers:
        - name: trendstore
          image: sethuaws/trendstore:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
